<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <title>Liquid Glass Bottom Navigation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap');

    body {
      font-family: 'Satoshi', sans-serif;
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .bg-texture {
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
    }

    @view-transition { navigation: auto; }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.4s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::view-transition-old(root) { animation-name: fade-out; }
    ::view-transition-new(root) { animation-name: fade-in; }
    @keyframes fade-out {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.98); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Frosted glass navigation bar */
    .glass-nav {
      background: rgba(30, 30, 30, 0.45);
      backdrop-filter: blur(10px) saturate(180%);
      -webkit-backdrop-filter: blur(10px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 8px 32px 0 rgba(0, 0, 0, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.05),
        inset 0 -1px 1px rgba(255, 255, 255, 0.02);
    }

    /* Active tab liquid pill indicator */
    .liquid-pill {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 0;
      width: 20%; /* 5 items -> 20% each */
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.1), 0 0 20px rgba(0, 240, 255, 0.15);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
      pointer-events: none;
      z-index: 2;
    }

    /* Subtle glow for active icon */
    .active-icon-glow {
      filter: drop-shadow(0 0 12px rgba(255, 230, 150, 0.8));
    }

    /* Custom badge pulse animation */
    @keyframes softPulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.9; }
      100% { transform: scale(1); opacity: 1; }
    }
    .badge-pulse {
      animation: softPulse 2s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div class="w-full h-screen flex flex-col bg-[#0a0a0c] bg-texture relative overflow-hidden">

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-4 pt-14 pb-28">
      <div class="space-y-6">
        <div class="h-64 rounded-2xl bg-gradient-to-br from-neutral-800 to-neutral-900 border border-neutral-800/50 flex items-center justify-center p-6 relative overflow-hidden">
          <div class="absolute inset-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop')] bg-cover bg-center mix-blend-overlay"></div>
          <h1 class="text-4xl font-bold tracking-tight z-10 text-white/90 text-center">
            Liquid Glass
            <span class="block text-xl font-medium text-white/50 mt-2">Prismatic Bottom Navigation</span>
          </h1>
        </div>
        
        <div class="flex gap-4">
          <div class="flex-1 h-32 rounded-2xl bg-neutral-900 border border-neutral-800/50"></div>
          <div class="flex-1 h-32 rounded-2xl bg-neutral-900 border border-neutral-800/50"></div>
        </div>
        
        <div class="h-48 rounded-2xl bg-neutral-900 border border-neutral-800/50 flex items-center p-6">
          <p class="text-neutral-400 leading-relaxed text-sm">
            Tap any icon to see the liquid pill glide smoothly across the frosted glass.
          </p>
        </div>
        <div class="h-48 rounded-2xl bg-neutral-900 border border-neutral-800/50"></div>
        <div class="h-48 rounded-2xl bg-neutral-900 border border-neutral-800/50"></div>
      </div>
    </main>

    <!-- Fixed Bottom Glass Navigation -->
    <div class="fixed bottom-0 left-0 right-0 z-50 flex justify-center px-4 pb-[34px] pt-4 pointer-events-none">
      <nav id="bottom-nav" class="glass-nav relative overflow-hidden rounded-full h-[68px] w-full max-w-[380px] pointer-events-auto flex items-center px-2">
        
        <!-- Liquid pill indicator -->
        <div id="liquid-pill" class="liquid-pill"></div>

        <!-- Nav Item: Home (Active) -->
        <button class="tab-btn relative flex-1 h-[52px] flex items-center justify-center rounded-full transition-all duration-300 group" aria-label="Home" data-index="0">
          <iconify-icon icon="fluent:home-24-filled" class="text-[28px] text-white active-icon-glow transition-all duration-300"></iconify-icon>
        </button>

        <!-- Nav Item: Play -->
        <button class="tab-btn relative flex-1 h-[52px] flex items-center justify-center rounded-full transition-all duration-300 group" aria-label="Play" data-index="1">
          <iconify-icon icon="fluent:play-circle-24-regular" class="text-[28px] text-white/70 group-hover:text-white transition-all duration-300"></iconify-icon>
        </button>

        <!-- Nav Item: Heart with Badge -->
        <button class="tab-btn relative flex-1 h-[52px] flex items-center justify-center rounded-full transition-all duration-300 group" aria-label="Heart" data-index="2">
          <div class="relative">
            <iconify-icon icon="fluent:heart-24-regular" class="text-[28px] text-white/70 group-hover:text-white transition-all duration-300"></iconify-icon>
            <!-- Red Badge with pulse -->
            <div class="absolute -top-1 -right-1.5 w-5 h-5 bg-[#ff2d55] rounded-full border-[2px] border-[#1e1e1e] flex items-center justify-center badge-pulse">
              <span class="text-[10px] font-bold text-white leading-none">1</span>
            </div>
          </div>
        </button>

        <!-- Nav Item: Search -->
        <button class="tab-btn relative flex-1 h-[52px] flex items-center justify-center rounded-full transition-all duration-300 group" aria-label="Search" data-index="3">
          <iconify-icon icon="fluent:search-24-regular" class="text-[28px] text-white/70 group-hover:text-white transition-all duration-300"></iconify-icon>
        </button>

        <!-- Nav Item: Profile -->
        <button class="tab-btn relative flex-1 h-[52px] flex items-center justify-center rounded-full transition-all duration-300 group" aria-label="Profile" data-index="4">
          <div class="relative">
            <div class="w-7 h-7 rounded-full overflow-hidden border border-white/20 group-hover:border-white/50 transition-all duration-300">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&h=100&q=80" alt="Profile" class="w-full h-full object-cover" />
            </div>
            <!-- Small status dot -->
            <div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-[#ff2d55] rounded-full border border-[#1e1e1e]"></div>
          </div>
        </button>

      </nav>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const nav = document.getElementById('bottom-nav');
      const tabs = nav.querySelectorAll('.tab-btn');
      const pill = document.getElementById('liquid-pill');
      let activeIndex = 0;
      tabs[0].classList.add('active');

      function movePill(index) {
        pill.style.transform = `translateX(${index * 100}%)`;
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => {
          if (activeIndex === index) return;

          // Update active state
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          // Update icon colors
          tabs.forEach((t, i) => {
            const icon = t.querySelector('iconify-icon');
            if (icon) {
              if (i === index) {
                icon.classList.add('text-white', 'active-icon-glow');
                icon.classList.remove('text-white/70');
              } else {
                icon.classList.add('text-white/70');
                icon.classList.remove('text-white', 'active-icon-glow');
              }
            }
          });

          activeIndex = index;

          // Move pill
          movePill(index);
        });
      });

      // Initialize pill position
      movePill(0);
    });
  </script>
</body>
</html>
