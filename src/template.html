<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Học từ vựng Anh - Đức (7.500+ từ): 4 dạng bài tập, từ điển A-Z có ví dụ, ôn từ sai. Offline, 1 file duy nhất.">
<title>Học Từ Vựng Anh · Đức — 4 Bài Tập</title>
<style>
  :root{
    --bg:#0b1220; --panel:#0f1a30; --panel2:#0c1526; --line:#1b2740; --line2:#2b3b5e;
    --text:#e6edf7; --muted:#8fa3c0; --dim:#5b6f92;
    --accent:#3b82f6; --accent-soft:rgba(59,130,246,.18);
    --ok:#34d399; --ok-bg:#052e22; --ok-line:#10b981;
    --bad:#f87171; --bad-bg:#2d0f14; --bad-line:#ef4444;
    --warn:#fbbf24;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:radial-gradient(900px 420px at 50% -120px, rgba(59,130,246,.20), transparent 70%), var(--bg);
    color:var(--text); min-height:100vh; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:16px 16px 112px}

  /* ---------- hero ---------- */
  .hero{text-align:center;padding:10px 0 2px}
  .hero h1{font-size:clamp(1.3rem,4.2vw,1.7rem);font-weight:800;letter-spacing:-.02em}
  .hero h1 .hl{background:linear-gradient(90deg,#60a5fa,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* ---------- screens ---------- */
  .screen{display:none}
  .screen.active{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------- controls ---------- */
  .controls{margin:14px 0 12px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:3px}
  .seg-btn{padding:8px 14px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s,color .15s}
  .seg-btn.active{background:var(--accent);color:#fff}
  .field{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
  select{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:13.5px;outline:none}
  select:focus-visible{border-color:var(--accent)}
  .lbl{color:var(--muted);font-size:13.5px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s,color .15s}
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:#0e7490;border-color:#0e7490;color:#fff}
  .chip.warn{color:var(--warn);border-color:#78350f}
  .chip.warn.active{background:#b45309;border-color:#b45309;color:#fff}

  /* ---------- home ---------- */
  .statcard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .sc{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 10px;text-align:center}
  .sc-n{font-size:1.35rem;font-weight:800;color:#cfe1ff;font-variant-numeric:tabular-nums}
  .sc-n.warn{color:var(--warn)}
  .sc-l{font-size:11.5px;color:var(--dim);margin-top:2px}
  .homegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .hcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;color:var(--text);transition:border-color .15s,background .15s}
  .hcard:hover{border-color:var(--accent);background:#12203a}
  .hcard .hn{width:24px;height:24px;border-radius:8px;background:#1c2a47;color:var(--muted);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
  .hcard .ht{font-weight:700;font-size:14.5px}
  .hcard .hs{font-size:12px;color:var(--dim);line-height:1.35}
  .hcard .hp{font-size:11.5px;color:var(--muted);font-weight:600}
  .hcard .hp.done{color:var(--ok)}
  .quick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .qbtn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:11px;border:1.5px solid var(--line2);background:transparent;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
  .qbtn:hover{border-color:var(--accent);background:#12203a}
  .qbtn.warn{color:var(--warn);border-color:#78350f}
  .qbtn.warn:hover{background:#2a1608;border-color:#b45309}

  /* ---------- section ---------- */
  .section{display:block}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .sec-title{font-size:1.05rem;font-weight:700;color:#cfe1ff}
  .sec-sub{color:var(--dim);font-size:12.5px;margin-top:3px}
  .empty{background:var(--panel);border:1px dashed var(--line2);border-radius:var(--radius);padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}

  /* ---------- exercise head ---------- */
  .exhead{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
  .exhead-main{flex:1;min-width:0}
  .ex-title{font-size:1rem;font-weight:800;color:#cfe1ff}
  .ex-sub{font-size:12px;color:var(--dim);margin-top:2px}
  .ibtn{width:38px;height:38px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:18px;line-height:1;cursor:pointer;transition:border-color .15s,color .15s}
  .ibtn:hover{border-color:var(--accent);color:var(--text)}
  .exbar{display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
  .extabs{width:100%;flex-wrap:wrap;justify-content:center}
  .extabs .seg-btn{flex:0 0 auto;white-space:nowrap}
  .statline{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:12px}
  .statline b{color:var(--text);font-variant-numeric:tabular-nums}
  .statline .ok b{color:var(--ok)}
  .statline .bad b{color:var(--bad)}
  .pbar{flex:1;height:5px;border-radius:3px;background:#1c2a47;overflow:hidden;min-width:60px}
  .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .25s ease}
  .expanel{display:none}
  .expanel.active{display:block}

  /* ---------- question card ---------- */
  .q{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 10px 30px -20px rgba(0,0,0,.9)}
  .qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.02em}
  .qnum .n{color:#42536f}
  .spk{margin-left:auto;border:0;background:#22304f;color:#dbe7fb;border-radius:8px;cursor:pointer;padding:6px 11px;font-size:14px;line-height:1;transition:background .15s}
  .spk:hover{background:#31446d}
  .spk:active{background:#0e7490}
  .qword{font-size:clamp(1.2rem,4vw,1.45rem);font-weight:800;color:#fbd063;letter-spacing:-.01em;overflow-wrap:anywhere}
  .qphon{font-family:Consolas,'Cascadia Mono',monospace;color:var(--muted);font-size:.85rem;margin:2px 0 10px}
  .qprompt{color:var(--muted);font-size:13px;margin-bottom:9px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line2);background:var(--panel2);color:var(--text);cursor:pointer;font-size:15px;transition:border-color .15s,background .15s,transform .06s}
  .opt:hover:not(:disabled){border-color:var(--accent);background:#14213c}
  .opt:active:not(:disabled){transform:scale(.995)}
  .opt .key{flex:0 0 22px;height:22px;border-radius:6px;background:#1c2a47;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
  .opt.correct{border-color:var(--ok-line);background:var(--ok-bg);color:#a7f3d0}
  .opt.correct .key{background:#065f46;color:#d1fae5}
  .opt.wrong{border-color:var(--bad-line);background:var(--bad-bg);color:#fecaca}
  .opt.wrong .key{background:#7f1d1d;color:#fee2e2}
  .opt:disabled{cursor:default;opacity:1}

  /* ---------- writing ---------- */
  .winput{width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line2);background:var(--panel2);color:var(--text);font-size:16px;outline:none;transition:border-color .15s,background .15s}
  .winput::placeholder{color:#42536f}
  .winput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .winput.correct{border-color:var(--ok-line);background:var(--ok-bg)}
  .winput.wrong{border-color:var(--bad-line);background:var(--bad-bg)}
  .winput.shake{animation:shake .35s}
  @keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:10px;border:1.5px solid transparent;font-size:14px;font-weight:600;cursor:pointer;transition:filter .15s,background .15s,border-color .15s,color .15s}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.12)}
  .btn.ghost{background:transparent;border-color:var(--line2);color:var(--muted)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--text)}
  .btn.warn{background:#7c2d12;color:#fed7aa}
  .btn.warn:hover{filter:brightness(1.15)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .fb{margin-top:8px;font-size:14px;min-height:0}
  .fb .ok{color:var(--ok)}
  .fb .bad{color:var(--bad)}
  .fb b{color:inherit}
  .spk-after{display:none}
  .q.answered .spk-after{display:inline-flex}
  .exfb{margin-top:9px;padding:9px 11px;border-radius:10px;background:#0b1528;border:1px solid var(--line)}
  .ex-s{font-size:13.5px;color:#dbe7fb}
  .ex-t{font-size:13px;color:var(--muted);margin-top:3px}
  .banknote{margin-top:6px;font-size:12.5px;color:var(--warn)}

  /* ---------- done ---------- */
  .done{margin-top:6px}
  .donecard{background:linear-gradient(180deg,#122442,#0f1a30);border:1px solid var(--line2);border-radius:var(--radius);padding:22px;text-align:center}
  .done-top{font-size:1.1rem;font-weight:800}
  .done-score{font-size:1.7rem;font-weight:800;color:var(--ok);margin:6px 0}
  .done-note{color:var(--muted);font-size:13.5px;margin-bottom:14px}
  .done-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  /* ---------- dictionary ---------- */
  .searchbar{display:flex;gap:8px;align-items:center;margin:10px 0}
  .searchbar input{flex:1;min-width:0;padding:11px 14px;border-radius:11px;border:1.5px solid var(--line2);background:var(--panel2);color:var(--text);font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
  .searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .searchbar input::placeholder{color:#42536f}
  .searchbar button{padding:10px 13px;border-radius:10px;border:1.5px solid var(--line2);background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
  .searchbar button:hover{border-color:var(--accent);color:var(--text)}
  .lstmeta{color:var(--dim);font-size:12.5px;margin-bottom:8px}
  .azchips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
  .azchips::-webkit-scrollbar{display:none}
  .az{flex:0 0 auto;width:29px;height:29px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
  .az.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .az.off{opacity:.28;cursor:default}
  .dgroup{margin-bottom:16px}
  .dgt{font-size:12.5px;font-weight:700;color:#9db4d6;text-transform:none;margin:6px 0 7px;display:flex;justify-content:space-between;gap:8px}
  .dgt span{color:var(--dim);font-weight:600}
  .drow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:6px;cursor:pointer;transition:border-color .15s}
  .drow:hover{border-color:var(--line2)}
  .dmain{flex:1;min-width:0}
  .dword{font-weight:700;color:#fbd063;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;overflow-wrap:anywhere}
  .dpos{font-size:10.5px;font-weight:700;color:#9db4d6;background:#182742;border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
  .dphon{font-family:Consolas,'Cascadia Mono',monospace;color:var(--dim);font-size:11.5px;margin-top:1px}
  .dmean{color:var(--text);font-size:13.5px;margin-top:3px;overflow-wrap:anywhere}
  .dex{color:var(--dim);font-size:11px;margin-top:3px}
  .drow .spk2{flex:0 0 auto;border:0;background:#22304f;color:#dbe7fb;border-radius:7px;cursor:pointer;padding:5px 9px;font-size:12px;line-height:1.3}
  .drow .spk2:hover{background:#31446d}
  .dmore{color:var(--dim);font-size:12px;text-align:center;padding:6px}
  .lempty{background:var(--panel);border:1px dashed var(--line2);border-radius:var(--radius);padding:24px 16px;text-align:center;color:var(--muted)}

  /* ---------- sheet ---------- */
  .sheet-wrap{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center}
  .sheet-wrap[hidden]{display:none}
  .sheet-bd{position:absolute;inset:0;background:rgba(2,6,14,.66);backdrop-filter:blur(2px)}
  .sheet{position:relative;width:min(880px,100%);max-height:82vh;overflow:auto;background:#0d1729;border:1px solid var(--line2);border-bottom:0;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px -10px #000;animation:sheetup .2s ease}
  @keyframes sheetup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:15px;cursor:pointer}
  .sheet-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:44px}
  .sheet-word{font-size:1.5rem;font-weight:800;color:#fbd063;overflow-wrap:anywhere}
  .sheet-phon{font-family:Consolas,'Cascadia Mono',monospace;color:var(--muted);font-size:.9rem}
  .sheet-sec{margin-top:16px;font-size:12.5px;font-weight:800;color:#9db4d6;text-transform:uppercase;letter-spacing:.06em}
  .sheet-mean{font-size:15px;color:var(--text);margin-top:8px;overflow-wrap:anywhere}
  .exlist{margin:8px 0 0 18px;display:flex;flex-direction:column;gap:9px}
  .exlist li{font-size:14px}
  .exlist .ex-s{color:#dbe7fb}
  .exlist .ex-t{font-size:13px;color:var(--muted);margin-top:2px}
  .ex-none{color:var(--dim);font-size:13.5px;margin-top:8px}
  .sheet-actions{display:flex;justify-content:flex-end;margin-top:16px}

  /* ---------- footer ---------- */
  .foot{margin-top:30px;text-align:center;color:var(--dim);font-size:12.5px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .foot b{color:var(--muted)}
  .foot .btn{padding:8px 14px;font-size:13px}

  /* ---------- error bar ---------- */
  .errbar{position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#7c2d12;color:#fed7aa;border:1px solid #b45309;border-radius:10px;padding:10px 14px;font-size:13px;display:none;box-shadow:0 10px 30px -10px #000}

  /* ---------- liquid glass bottom nav (Superdesign v6) ---------- */
  .bnav{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:70;
    width:min(calc(100vw - 32px),380px);height:68px;display:flex;align-items:center;
    padding:0 8px;border-radius:999px;overflow:hidden;
    background:rgba(30,30,30,.45);
    backdrop-filter:blur(10px) saturate(180%);
    -webkit-backdrop-filter:blur(10px) saturate(180%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 8px 32px 0 rgba(0,0,0,.30),
      inset 0 1px 1px rgba(255,255,255,.05),
      inset 0 -1px 1px rgba(255,255,255,.02)}
  .bnav-pill{position:absolute;top:8px;bottom:8px;left:8px;width:calc((100% - 16px) / 5);
    border-radius:999px;background:rgba(255,255,255,.15);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 1px 4px rgba(255,255,255,.10), 0 0 20px rgba(0,240,255,.15);
    transform:translateX(calc(var(--nav-i, 2) * 100%));
    transition:transform .5s cubic-bezier(.34,1.56,.64,1);
    will-change:transform;pointer-events:none;z-index:2}
  .bnav:not(.is-ready) .bnav-pill{transition:none}
  .bnav-item{position:relative;z-index:3;flex:1 1 0;height:52px;
    display:flex;align-items:center;justify-content:center;
    border:0;background:transparent;border-radius:999px;cursor:pointer;
    color:rgba(255,255,255,.70);-webkit-tap-highlight-color:transparent}
  .bnav-item svg{width:28px;height:28px;display:block;transition:color .3s,filter .3s,transform .3s}
  .bnav-item:hover{color:#fff}
  .bnav-item.active{color:#fff}
  .bnav-item.active svg{filter:drop-shadow(0 0 12px rgba(255,230,150,.8))}
  .bnav .lang{font-size:12.5px;font-weight:800;letter-spacing:.5px;color:rgba(255,255,255,.55)}
  .bnav .lang.on{color:#fff}
  .bnav .ico{position:relative;display:inline-flex}
  .bnav .avatar-img{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#2b3f63,#17243b);border:1px solid rgba(255,255,255,.20);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.08);overflow:hidden}
  .bnav .avatar-img svg{width:17px;height:17px;color:#dbe7fb}
  .bnav-item.active .avatar-img{box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 12px rgba(255,230,150,.45)}
  .bnav .badge{position:absolute;bottom:-4px;right:-6px;min-width:20px;height:20px;padding:0 5px;
    border-radius:999px;background:#ff2d55;color:#fff;font-size:10px;font-weight:800;
    line-height:16px;text-align:center;border:2px solid #1e1e1e;
    animation:softPulse 2s infinite ease-in-out}
  @keyframes softPulse{
    0%,100%{transform:scale(1);opacity:1}
    50%{transform:scale(1.1);opacity:.9}
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .bnav{background:rgba(24,24,24,.92)}
    .bnav-pill{background:rgba(255,255,255,.18)}
  }

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:560px){
    .wrap{padding:12px 12px 112px}
    .q{padding:14px}
    .homegrid{grid-template-columns:1fr 1fr}
    .hcard{padding:12px}
    .exhead{margin-top:4px}
  }
  @media (max-width:360px){
    .homegrid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<div class="errbar" id="errBar"></div>
<div class="wrap">

  <header class="hero">

<script>
const DATASETS = __DATA_JSON__;
</script>
<script>
'use strict';
window.addEventListener('error', function(ev){
  try {
    const bar = document.getElementById('errBar');
    if (bar){ bar.style.display = 'block'; bar.textContent = '⚠️ Lỗi JavaScript: ' + (ev.message || 'unknown') + ' — chụp màn hình gửi lại để được hỗ trợ.'; }
  } catch (e) {}
});
/* ================= utils ================= */
const $ = function(id){ return document.getElementById(id); };
const $$ = function(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
const esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
const norm = function(s){ return String(s == null ? '' : s).toLowerCase().trim().replace(/\s+/g, ' '); };
const fold = function(s){ return norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/ß/g, 'ss'); };
const fmt = function(n){ return Number(n || 0).toLocaleString('vi-VN'); };
const dispWord = function(s){
  const raw = String(s == null ? '' : s);
  const t = raw.replace(/\s*\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
  return t || raw.trim();
};
const shuffle = function(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
};
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffleRng(arr, rng){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const TABS = ['mc-en', 'write-en', 'write-vn', 'mc-vn'];
const EX_LABEL = { 'mc-en': 'Chọn nghĩa', 'write-en': 'Viết nghĩa', 'write-vn': 'Viết từ', 'mc-vn': 'Chọn từ' };
const SCREENS = ['home', 'exercise', 'wrong', 'dict'];
const SIZES = [20, 50, 100];
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').concat(['#']);

/* ================= storage ================= */
const LS = {
  get: function(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del: function(k){ try { localStorage.removeItem(k); } catch (e) {} }
};

/* ================= settings / global state ================= */
const DEF_SETTINGS = { lang: 'en', ds: 'en1k', size: 50, screen: 'home', ex: 'mc-en', dletter: 'A' };
const STORED_SET = LS.get('v4t:set', {}) || {};
let settings = Object.assign({}, DEF_SETTINGS, STORED_SET);
(function migrateSettings(){
  const oldTab = STORED_SET.tab;
  if (!('screen' in STORED_SET)){
    settings.screen = (oldTab === 'list-1k' || oldTab === 'list-3k') ? 'dict' : 'home';
  }
  if (!('ex' in STORED_SET)){
    settings.ex = TABS.indexOf(oldTab) !== -1 ? oldTab : 'mc-en';
  }
  delete settings.tab;
})();
if (settings.lang !== 'de') settings.lang = 'en';
if (settings.ds === 'wrong' || !DATASETS[settings.ds]) settings.ds = settings.lang === 'de' ? 'de3k' : 'en1k';
if (DATASETS[settings.ds] && DATASETS[settings.ds].lang !== settings.lang) settings.ds = settings.lang === 'de' ? 'de3k' : 'en1k';
if (SIZES.indexOf(+settings.size) === -1) settings.size = 50;
else settings.size = +settings.size;
if (TABS.indexOf(settings.ex) === -1) settings.ex = 'mc-en';
delete settings.dlang;
if (LETTERS.indexOf(settings.dletter) === -1) settings.dletter = 'A';
let stats = Object.assign({ answered: 0, correct: 0 }, LS.get('v4t:stats', {}));
let wrong = LS.get('v4t:wrong', { en: [], de: [] });
wrong.en = Array.isArray(wrong.en) ? wrong.en : [];
wrong.de = Array.isArray(wrong.de) ? wrong.de : [];
const wrongStamp = { en: 0, de: 0 };

const S = {};
let CUR_DS = settings.ds;
const DRAFT = {};
const NUM_INDEX = {};
Object.keys(DATASETS).forEach(function(k){
  NUM_INDEX[k] = {};
  DATASETS[k].words.forEach(function(w){ NUM_INDEX[k][w.num] = w; });
});
const LANG_POOL = { en: [], de: [] };
Object.keys(DATASETS).forEach(function(k){
  const lang = DATASETS[k].lang;
  DATASETS[k].words.forEach(function(w){ LANG_POOL[lang].push(w); });
});

/* ================= lookups ================= */
function dsLabel(k){
  if (k === 'en1k') return fmt(DATASETS.en1k.words.length) + ' từ cơ bản';
  if (k === 'en3k') return fmt(DATASETS.en3k.words.length) + ' từ thông dụng';
  if (k === 'de3k') return 'Deutsch · ' + fmt(DATASETS.de3k.words.length) + ' từ';
  return 'Từ sai';
}
function langName(){ return settings.lang === 'de' ? 'Đức' : 'Anh'; }
function poolFor(ds){
  if (ds === 'wrong') return wrong[settings.lang].slice();
  return DATASETS[ds] ? DATASETS[ds].words : [];
}
function byNum(ds, num){ const m = NUM_INDEX[ds]; return m ? m[num] : undefined; }
function sample(pool, n){ return shuffle(pool).slice(0, Math.min(n, pool.length)); }
function wkey(v){ return String(v.word) + '|' + String(v.meaning); }
function primaryType(t){
  const raw = String(t || '').trim();
  if (!raw) return '';
  return raw.split(/[,;.]/)[0].trim().toLowerCase();
}
function bankSet(lang){
  const set = Object.create(null);
  const bank = wrong[lang] || [];
  for (let i = 0; i < bank.length; i++) set[wkey(bank[i])] = 1;
  return set;
}
function bumpWrong(){ wrongStamp[settings.lang]++; }

/* ================= sessions ================= */
function getSession(ds, ex, force){
  if (!S[ds]) S[ds] = {};
  if (force) delete S[ds][ex];
  let s = S[ds][ex];
  if (s && ds === 'wrong' && !force && s.stamp !== wrongStamp[settings.lang]){
    delete S[ds][ex];
    s = null;
  }
  if (!s){
    if (!force) s = loadSaved(ds, ex);
    if (!s){
      s = { items: sample(poolFor(ds), settings.size), answers: {}, seeds: {}, stamp: ds === 'wrong' ? wrongStamp[settings.lang] : 0 };
    }
    S[ds][ex] = s;
    saveSaved(ds, ex, s);
  }
  return S[ds][ex];
}
function loadSaved(ds, ex){
  if (ds === 'wrong') return null;
  const rec = LS.get('v4t:s:' + ds + ':' + ex, null);
  if (!rec || !Array.isArray(rec.nums) || !rec.answers) return null;
  const items = [];
  for (let i = 0; i < rec.nums.length; i++){
    const w = byNum(ds, rec.nums[i]);
    if (!w) return null;
    items.push(w);
  }
  if (!items.length) return null;
  const answers = {};
  Object.keys(rec.answers).forEach(function(k){
    const i = +k;
    if (Number.isInteger(i) && i >= 0 && i < items.length) answers[i] = rec.answers[k];
  });
  const seeds = {};
  if (rec.seeds && typeof rec.seeds === 'object'){
    Object.keys(rec.seeds).forEach(function(k){
      const i = +k;
      if (Number.isInteger(i) && i >= 0 && i < items.length) seeds[i] = +rec.seeds[k] || 0;
    });
  }
  return { items: items, answers: answers, seeds: seeds, stamp: 0 };
}
function saveSaved(ds, ex, s){
  if (ds === 'wrong' || !s || !s.items) return;
  LS.set('v4t:s:' + ds + ':' + ex, {
    v: 2,
    nums: s.items.map(function(w){ return w.num; }),
    answers: s.answers,
    seeds: s.seeds
  });
}
function ansCount(s){ return Object.keys(s.answers).length; }
function okCount(s){
  let c = 0;
  s.items.forEach(function(w, i){ if (s.answers[i] && s.answers[i].ok) c++; });
  return c;
}
function sessionProgress(ds, ex){
  const rec = LS.get('v4t:s:' + ds + ':' + ex, null);
  if (!rec || !Array.isArray(rec.nums) || !rec.nums.length) return null;
  return { done: Object.keys(rec.answers || {}).length, total: rec.nums.length };
}

/* ================= wrong-answer bank ================= */
function addWrong(v){
  const bank = wrong[settings.lang];
  const k = wkey(v);
  let found = false;
  for (let i = 0; i < bank.length; i++){ if (wkey(bank[i]) === k){ found = true; break; } }
  if (!found){
    bank.push({ num: v.num, word: v.word, type: v.type, phon: v.phon, meaning: v.meaning });
    if (bank.length > 1000) bank.splice(0, bank.length - 1000);
    LS.set('v4t:wrong', wrong);
    bumpWrong();
  }
  updateWrongUI();
}
function removeWrong(v){
  const bank = wrong[settings.lang];
  const k = wkey(v);
  const next = bank.filter(function(w){ return wkey(w) !== k; });
  if (next.length !== bank.length){
    wrong[settings.lang] = next;
    LS.set('v4t:wrong', wrong);
    bumpWrong();
  }
  updateWrongUI();
}
function updateWrongUI(){
  updateNav();
  if (settings.screen === 'home') renderHome(true);
  else if (settings.screen === 'wrong') renderWrong();
}

/* ================= text / chrome ================= */
function navIndex(){
  if (settings.screen === 'dict') return 3;
  if (settings.screen === 'wrong' || (settings.screen === 'exercise' && CUR_DS === 'wrong')) return 4;
  return 2;
}
function updateNav(){
  const wn = wrong[settings.lang].length;
  const badge = $('navBadge');
  if (badge){ badge.textContent = fmt(wn); badge.hidden = wn === 0; }

  const idx = navIndex();
  const nav = $('bnav');
  if (nav) nav.style.setProperty('--nav-i', String(idx));

  const activeName = idx === 4 ? 'wrong' : idx === 3 ? 'dict' : 'home';
  $$('.bnav .nav').forEach(function(b){
    const on = b.dataset.nav === activeName;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  $$('.bnav .lang').forEach(function(b){
    const on = b.dataset.lang === settings.lang;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const wrongBtn = document.querySelector('.bnav [data-nav="wrong"]');
  if (wrongBtn) wrongBtn.setAttribute('aria-label', wn ? 'Từ sai, ' + fmt(wn) + ' từ' : 'Từ sai');
}
function updateChrome(){
  $('heroLang').textContent = langName();
  document.title = 'Học Từ Vựng ' + langName() + ' · 4 Bài Tập';
  updateNav();
}
function renderChips(){
  $$('.dchips').forEach(function(box){
    let html = '';
    if (settings.lang === 'de'){
      html = chipHtml('de3k');
    } else {
      html = chipHtml('en1k') + chipHtml('en3k');
    }
    box.innerHTML = html;
    box.hidden = (CUR_DS === 'wrong');
  });
}
function chipHtml(k){
  const active = k === CUR_DS && settings.screen !== 'wrong';
  return '<button type="button" class="chip' + (active ? ' active' : '') + '" data-ds="' + k + '">' + esc(dsLabel(k)) + '</button>';
}
function renderFoot(){
  if (!$('footStats')) return;
  const total = stats.answered;
  if (!total){ $('footStats').textContent = 'Chưa có dữ liệu — bắt đầu làm bài nào!'; return; }
  const pct = Math.round(stats.correct / total * 100);
  $('footStats').innerHTML = 'Đã làm <b>' + fmt(total) + '</b> câu · đúng <b>' + pct + '%</b> · từ sai hiện tại: <b>' + fmt(wrong[settings.lang].length) + '</b>';
}

/* ================= speech ================= */
let voices = [];
function loadVoices(){
  try { voices = window.speechSynthesis ? (speechSynthesis.getVoices() || []) : []; } catch (e) { voices = []; }
}
if ('speechSynthesis' in window){
  loadVoices();
  try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
}
function speak(text, lang){
  try {
    if (!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) return;
    const clean = String(text == null ? '' : text).replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
    if (!clean) return;
    const code = (lang || settings.lang) === 'de' ? 'de-DE' : 'en-US';
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = code;
    u.rate = 0.9;
    const prefix = code.slice(0, 2);
    const v = voices.find(function(x){ return x.lang && x.lang.replace('_', '-').toLowerCase().indexOf(prefix) === 0; });
    if (v){ u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
function speakItem(tab, i){
  const s = S[CUR_DS] && S[CUR_DS][tab];
  if (s && s.items[i]) speak(s.items[i].word, settings.lang);
}

/* ================= distractors ================= */
function overlaps(a, b){
  if (!a || !b) return false;
  if (a === b) return true;
  if (a.length >= 3 && b.indexOf(a) !== -1) return true;
  if (b.length >= 3 && a.indexOf(b) !== -1) return true;
  return false;
}
function rngFor(s, i){
  if (!s.seeds) s.seeds = {};
  if (!s.seeds[i]) s.seeds[i] = Math.floor(Math.random() * 2147483647) + 1;
  return mulberry32(s.seeds[i]);
}
function distractors(correct, field, count, rng){
  count = count || 3;
  const pool = LANG_POOL[settings.lang] || [];
  const correctKey = wkey(correct);
  const cType = primaryType(correct.type);
  const seen = [fold(dispWord(correct[field]))];
  const typeCount = {};
  if (cType) typeCount[cType] = 1;
  const picked = [];
  const order = shuffleRng(pool, rng);
  for (let i = 0; i < order.length && picked.length < count; i++){
    const w = order[i];
    if (wkey(w) === correctKey) continue;
    const k = fold(dispWord(w[field]));
    if (!k) continue;
    let dup = false;
    for (let j = 0; j < seen.length; j++){ if (overlaps(seen[j], k)){ dup = true; break; } }
    if (dup) continue;
    const pt = primaryType(w.type);
    if (pt && (typeCount[pt] || 0) >= 2) continue;
    seen.push(k);
    if (pt) typeCount[pt] = (typeCount[pt] || 0) + 1;
    picked.push(w);
  }
  return picked;
}

/* ================= grading ================= */
function meaningParts(meaning){
  return String(meaning || '')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .split(/[,;/\|]+/)
    .map(function(s){ return s.trim(); })
    .filter(Boolean);
}
function stripArticle(w){
  return String(w || '').toLowerCase()
    .replace(/^(der|die|das|ein|eine|einen|einem|einer)\s+/, '')
    .replace(/\s*\(.*?\)/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function grade(dir, v, raw){
  const user = fold(raw);
  if (!user) return false;
  if (dir === 'en'){
    const parts = meaningParts(v.meaning).map(fold).filter(Boolean);
    return parts.some(function(p){
      if (p === user) return true;
      if (user.length >= 3 && p.indexOf(user) !== -1) return true;
      if (user.length >= 4 && user.indexOf(p) !== -1) return true;
      return false;
    });
  }
  const cands = [v.word];
  const noParen = String(v.word).replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
  if (noParen) cands.push(noParen);
  const noArt = stripArticle(noParen || v.word);
  if (noArt) cands.push(noArt);
  return cands.some(function(c){
    const cf = fold(stripArticle(c));
    if (!cf) return false;
    if (user === cf) return true;
    if (user === cf + 's' || user === cf + 'ed' || user === cf + 'ing') return true;
    const uf = fold(stripArticle(user));
    return uf && uf === cf;
  });
}

/* ================= render: question helpers ================= */
function phonLine(v){
  return v.phon ? '<div class="qphon">' + esc(v.phon) + '</div>' : '';
}
function fbHtml(tab, v, a){
  const ans = (tab === 'mc-en' || tab === 'write-en') ? v.meaning : dispWord(v.word);
  const ex = (v.ex && v.ex.length) ? v.ex[0] : null;
  const exHtml = ex ? ('<div class="exfb"><div class="ex-s">' + esc(ex.s) + '</div><div class="ex-t">' + esc(ex.t) + '</div></div>') : '';
  if (a.ok) return '<span class="ok">✓ Đúng! <b>' + esc(ans) + '</b></span>' + exHtml;
  return '<span class="bad">✗ Sai. Đáp án: <b>' + esc(ans) + '</b></span>' +
    (CUR_DS === 'wrong' ? '' : '<div class="banknote">⚠️ Đã lưu vào mục "Từ sai" — ôn lại ở tab Từ sai</div>') + exHtml;
}
function optHtml(tab, i, j, key, label, isCorrect, answered, chosen){
  let cls = 'opt';
  if (answered){
    if (isCorrect) cls += ' correct';
    else if (chosen === key) cls += ' wrong';
  }
  return '<button type="button" class="' + cls + '" data-mc="' + tab + ':' + i + '" data-key="' + esc(key) + '"' +
    (answered ? ' disabled' : '') + '>' +
    '<span class="key">' + 'ABCD'[j] + '</span><span>' + esc(label) + '</span></button>';
}
function renderMc(tab, s){
  const N = s.items.length;
  return s.items.map(function(v, i){
    const answered = s.answers[i] || null;
    const rng = rngFor(s, i);
    const dists = distractors(v, tab === 'mc-en' ? 'meaning' : 'word', 3, rng);
    const opts = shuffleRng([v].concat(dists), rng);
    const correctKey = tab === 'mc-en' ? v.meaning : v.word;
    let optsHtml = '';
    for (let j = 0; j < opts.length; j++){
      const w = opts[j];
      const key = tab === 'mc-en' ? w.meaning : w.word;
      const label = tab === 'mc-en' ? w.meaning : dispWord(w.word);
      optsHtml += optHtml(tab, i, j, key, label, key === correctKey, !!answered, answered ? answered.chosen : null);
    }
    const q = tab === 'mc-en' ? dispWord(v.word) : v.meaning;
    return '<article class="q" id="' + tab + '-q' + i + '" data-i="' + i + '">' +
      '<div class="qhead"><span class="qnum">Câu ' + (i + 1) + '<span class="n">/' + N + '</span></span>' +
      (tab === 'mc-en' ? '<button type="button" class="spk" data-spk="' + tab + ':' + i + '" title="Đọc từ">🔊</button>' : '') +
      '</div>' +
      '<div class="qword">' + esc(q) + '</div>' +
      (tab === 'mc-en' ? phonLine(v) : '') +
      '<div class="qprompt">' + (tab === 'mc-en' ? 'Chọn nghĩa đúng' : 'Chọn từ ' + langName() + ' đúng') + '</div>' +
      '<div class="opts">' + optsHtml + '</div>' +
      '<div class="fb" id="fb-' + tab + '-' + i + '" aria-live="polite">' +
        (answered ? fbHtml(tab, v, answered) : '') + '</div>' +
      '</article>';
  }).join('');
}

function renderDone(tab){
  const el = $('done-' + tab);
  if (!el) return;
  const s = S[CUR_DS] && S[CUR_DS][tab];
  if (!s || !s.items.length){ el.hidden = true; return; }
  const n = s.items.length;
  const done = ansCount(s);
  if (done < n){ el.hidden = true; return; }
  const c = okCount(s);
  const pct = Math.round(c / n * 100);
  const face = pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '💪';
  const nw = wrong[settings.lang].length;
  el.innerHTML = '<div class="donecard">' +
    '<div class="done-top">' + face + ' Hoàn thành ' + n + ' câu!</div>' +
    '<div class="done-score">' + c + '/' + n + ' · ' + pct + '%</div>' +
    '<div class="done-note">' + (n - c > 0
      ? (n - c) + ' câu sai đã được lưu vào <b>Từ sai</b> để ôn lại.'

    '<div class="done-actions">' +
      '<button type="button" class="btn primary" data-again="' + tab + '">↻ Làm bộ mới</button>' +
      (nw ? '<button type="button" class="btn warn" data-nav="wrong">Ôn ngay từ sai (' + fmt(nw) + ')</button>' : '') +
    '</div></div>';
  el.hidden = false;
}

/* ================= dictionary ================= */
const DICT_CACHE = {};
const DICT_MAP = {};
const SEG_CACHE = {};
const WRONG_VIEW = [];
function dictArr(lang){
  if (!DICT_CACHE[lang]){
    DICT_CACHE[lang] = buildDict(lang);
    DICT_MAP[lang] = {};
    DICT_CACHE[lang].forEach(function(e){ DICT_MAP[lang][e.key] = e; });
  }
  return DICT_CACHE[lang];
}
function buildDict(lang){
  const src = lang === 'de' ? ['de3k'] : ['en1k', 'en3k'];
  const map = new Map();
  src.forEach(function(k){
    DATASETS[k].words.forEach(function(w){
      const key = fold(dispWord(w.word)) || String(w.num);
      let e = map.get(key);
      if (!e){
        e = { key: key, word: w.word, disp: dispWord(w.word), phon: w.phon || '', type: w.type || '', meanings: [], ex: [], pairs: [], nums: [] };
        map.set(key, e);
      }
      if (w.meaning && !e.meanings.some(function(m){ return norm(m) === norm(w.meaning); })) e.meanings.push(w.meaning);
      if (w.phon && !e.phon) e.phon = w.phon;
      if (w.type && !e.type) e.type = w.type;
      if (Array.isArray(w.ex)){
        w.ex.forEach(function(x){
          if (x && x.s && !e.ex.some(function(y){ return y.s === x.s; })) e.ex.push({ s: x.s, t: x.t || '' });
        });
      }
      e.pairs.push(wkey(w));
      e.nums.push(w.num);
    });
  });
  const arr = Array.from(map.values());
  arr.forEach(function(e){
    e.mean = e.meanings.join(' · ');
    e.sort = e.key.replace(/^(der|die|das|ein|eine|einen|einem|einer)\s+/, '');
    e.letter = /^[a-z]/.test(e.sort) ? e.sort.charAt(0).toUpperCase() : '#';
  });
  arr.sort(function(a, b){ return a.sort.localeCompare(b.sort, lang === 'de' ? 'de' : 'en'); });
  return arr;
}
function segIndex(lang){
  if (!SEG_CACHE[lang]){
    const idx = {};
    dictArr(lang).forEach(function(e){
      e.meanings.forEach(function(m){
        meaningParts(m).forEach(function(part){
          const k = fold(part);
          if (k.length < 2) return;
          if (!idx[k]) idx[k] = { label: part, items: [] };
          if (!idx[k].items.some(function(x){ return x.key === e.key; })) idx[k].items.push(e);
        });
      });
    });
    Object.keys(idx).forEach(function(k){
      idx[k].items.sort(function(a, b){ return a.sort.localeCompare(b.sort, lang === 'de' ? 'de' : 'en'); });
    });
    SEG_CACHE[lang] = idx;
  }
  return SEG_CACHE[lang];
}
function dictRow(e){
  const inBank = e.pairs.some(function(p){ return bankSet(settings.lang)[p]; });
  return '<div class="drow" data-dkey="' + esc(e.key) + '" role="button" tabindex="0">' +
    '<div class="dmain"><div class="dword">' + esc(e.disp) +
      (e.type ? '<span class="dpos">' + esc(e.type) + '</span>' : '') +
      (inBank ? '<span class="lsaved" title="Đang trong danh sách từ sai">⚠️</span>' : '') +
    '</div>' +
    (e.phon ? '<div class="dphon">' + esc(e.phon) + '</div>' : '') +
    '<div class="dmean">' + esc(e.mean) + '</div>' +
    (e.ex.length ? '<div class="dex">' + e.ex.length + ' ví dụ</div>' : '') +
    '</div>' +
    '<button type="button" class="spk2" data-dspk="' + esc(e.key) + '" title="Đọc từ">🔊</button>' +
    '</div>';
}
function renderDict(){
  const lang = settings.lang;
  $$('#dictLangSeg .seg-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.dictLang === lang); });
  const arr = dictArr(lang);
  const q = $('dictQ').value.trim();
  $('dictSub').textContent = (lang === 'de' ? 'Deutsch' : 'English') + ' · ' + fmt(arr.length) + ' từ · A-Z';
  if (q){ renderDictSearch(lang, q); return; }
  const groups = {};
  arr.forEach(function(e){ (groups[e.letter] = groups[e.letter] || []).push(e); });
  let html = '';
  let first = '';
  LETTERS.forEach(function(L){
    const n = groups[L] ? groups[L].length : 0;
    if (n && !first) first = L;
    html += '<button type="button" class="az' + (settings.dletter === L ? ' on' : '') + (n ? '' : ' off') + '" data-az="' + L + '"' + (n ? '' : ' disabled') + '>' + L + '</button>';
  });
  $('dictAZ').innerHTML = html;
  $('dictAZ').hidden = false;
  let letter = settings.dletter;
  if (!groups[letter]){
    letter = first || '';
    settings.dletter = letter || 'A';
    LS.set('v4t:set', settings);
  }
  if (!letter){
    $('dictMeta').textContent = '';
    $('dictBody').innerHTML = '<div class="lempty">Chưa có dữ liệu.</div>';
    return;
  }
  const rows = groups[letter] || [];
  $('dictMeta').textContent = letter + ' · ' + fmt(rows.length) + ' từ';
  $('dictBody').innerHTML = rows.map(dictRow).join('') || '<div class="lempty">Không có từ nào.</div>';
}
function renderDictSearch(lang, q){
  const arr = dictArr(lang);
  const seg = segIndex(lang);
  const tokens = fold(q).split(/\s+/).filter(Boolean);
  $('dictAZ').hidden = true;
  const wordHits = arr.filter(function(e){
    return tokens.every(function(t){ return e.key.indexOf(t) !== -1; });
  });
  const meanHits = arr.filter(function(e){
    return tokens.every(function(t){ return fold(e.mean).indexOf(t) !== -1; });
  });
  const groups = [];
  const fullKey = fold(q).replace(/\s+/g, ' ').trim();
  const exact = seg[fullKey];
  if (exact && exact.items.length >= 2) groups.push(exact);
  let html = '';
  let shown = 0;
  function section(title, items){
    if (!items.length) return;
    shown += items.length;
    const cap = 120;
    html += '<div class="dgroup"><div class="dgt"><span>' + esc(title) + '</span><span>' + fmt(items.length) + ' từ</span></div>' +
      items.slice(0, cap).map(dictRow).join('') +
      (items.length > cap ? '<div class="dmore">… +' + fmt(items.length - cap) + ' từ</div>' : '') +
      '</div>';
  }
  if (wordHits.length) section('Từ khớp', wordHits);
  groups.forEach(function(g){ section('Cùng nghĩa: ' + g.label, g.items); });
  if (!groups.length && meanHits.length) section('Khớp nghĩa', meanHits);
  if (!html){
    $('dictMeta').textContent = 'Không tìm thấy';
    $('dictBody').innerHTML = '<div class="lempty">Không tìm thấy từ nào khớp “<b>' + esc(q) + '</b>”.</div>';
    return;
  }
  $('dictMeta').textContent = 'Tìm thấy ' + fmt(shown) + ' kết quả';
  $('dictBody').innerHTML = html;
}

  const exHtml = e.ex.length

      }).join('') + '</ol>'

    '<button type="button" class="spk" data-sheet-spk="' + esc(e.key) + '">🔊 Nghe</button></div>' +
    '<div class="sheet-mean">' + esc(e.mean) + '</div>' +
    '<div class="sheet-sec">Ví dụ</div>' + exHtml +

  document.body.style.overflow = 'hidden';

function updateStat(tab){

  const total = s ? s.items.length : 0;
  const done = s ? ansCount(s) : 0;
  const ok = s ? okCount(s) : 0;
  $('stCorrect').textContent = ok;
  $('stWrong').textContent = done - ok;
  $('stDone').textContent = done;
  $('stTotal').textContent = total;
  $('stFill').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
}

/* ================= navigation ================= */
function showScreen(name){
  if (SCREENS.indexOf(name) === -1) return;
  settings.screen = name;
  if (name !== 'exercise') CUR_DS = settings.ds;
  LS.set('v4t:set', settings);
  $$('.screen').forEach(function(s){ s.classList.toggle('active', s.id === 'screen-' + name); });
  rerender();
  window.scrollTo(0, 0);
}
function showExercise(ex){
  if (TABS.indexOf(ex) === -1) return;
  CUR_DS = settings.ds;
  settings.ex = ex;
  settings.screen = 'exercise';
  LS.set('v4t:set', settings);
  $$('.screen').forEach(function(s){ s.classList.toggle('active', s.id === 'screen-exercise'); });
  rerender();
  window.scrollTo(0, 0);
  const s = S[CUR_DS] && S[CUR_DS][ex];
  if (s && (ex === 'write-en' || ex === 'write-vn')){
    for (let j = 0; j < s.items.length; j++){
      if (!s.answers[j]){
        const inp = $((ex === 'write-en' ? 'we-in' : 'wv-in') + j);
        if (inp){ setTimeout(function(){ inp.focus({ preventScroll: true }); }, 80); }
        break;
      }
    }
  }
}
function selectEx(ex){
  if (TABS.indexOf(ex) === -1) return;
  settings.ex = ex;
  LS.set('v4t:set', settings);
  renderExercise();
}
function setDs(ds){
  if (!DATASETS[ds] || DATASETS[ds].lang !== settings.lang) return;
  settings.ds = ds;
  CUR_DS = ds;
  settings.screen = settings.screen === 'wrong' ? 'home' : settings.screen;
  LS.set('v4t:set', settings);
  rerender();
}
function setLang(lang){
  if ((lang !== 'en' && lang !== 'de') || lang === settings.lang) return;
  settings.lang = lang;
  if (DATASETS[settings.ds] && DATASETS[settings.ds].lang !== lang) settings.ds = lang === 'de' ? 'de3k' : 'en1k';
  if (settings.screen === 'dict') settings.dletter = 'A';
  if (CUR_DS !== 'wrong') CUR_DS = settings.ds;
  delete S.wrong;
  LS.set('v4t:set', settings);
  updateChrome();
  rerender();
}
function setDictLang(lang){
  if (lang !== 'en' && lang !== 'de') return;
  if (lang !== settings.lang) setLang(lang);
  settings.dletter = 'A';
  LS.set('v4t:set', settings);
  renderDict();
}
function setDictLetter(L){
  if (LETTERS.indexOf(L) === -1) return;
  settings.dletter = L;
  LS.set('v4t:set', settings);
  renderDict();
}
function practiceWrong(){
  if (!wrong[settings.lang].length) return;
  Object.keys(DRAFT).forEach(function(k){ if (k.indexOf('wrong|') === 0) delete DRAFT[k]; });
  CUR_DS = 'wrong';
  settings.screen = 'exercise';
  LS.set('v4t:set', settings);
  $$('.screen').forEach(function(s){ s.classList.toggle('active', s.id === 'screen-exercise'); });
  rerender();
  window.scrollTo(0, 0);
}
function backFromExercise(){
  if (CUR_DS === 'wrong'){
    CUR_DS = settings.ds;
    showScreen('wrong');
  } else {
    showScreen('home');
  }
}
function setSize(n){
  if (SIZES.indexOf(n) === -1) return;
  settings.size = n;
  LS.set('v4t:set', settings);
  Object.keys(S).forEach(function(ds){ delete S[ds]; });
  Object.keys(DRAFT).forEach(function(k){ delete DRAFT[k]; });
  try {
    Object.keys(localStorage).forEach(function(k){
      if (k.indexOf('v4t:s:') === 0) localStorage.removeItem(k);
    });
  } catch (e) {}
  rerender();
}
function rebuild(tab){
  if (S[CUR_DS]) delete S[CUR_DS][tab];
  if (CUR_DS !== 'wrong') LS.del('v4t:s:' + CUR_DS + ':' + tab);
  Object.keys(DRAFT).forEach(function(k){
    if (k.indexOf(CUR_DS + '|' + tab + '|') === 0) delete DRAFT[k];
  });
  if (settings.screen === 'exercise') renderExercise();
}
function clearData(){
  try {
    Object.keys(localStorage).forEach(function(k){
      if (k.indexOf('v4t:') === 0) localStorage.removeItem(k);
    });
  } catch (e) {}
  wrong = { en: [], de: [] };
  stats = { answered: 0, correct: 0 };
  settings = Object.assign({}, DEF_SETTINGS);
  wrongStamp.en = 0; wrongStamp.de = 0;
  Object.keys(S).forEach(function(k){ delete S[k]; });
  Object.keys(DRAFT).forEach(function(k){ delete DRAFT[k]; });
  CUR_DS = settings.ds;
}
function resetAll(){
  if (!window.confirm('Xóa toàn bộ tiến độ, từ sai và cài đặt?')) return;
  clearData();
  location.reload();
}

/* ================= answering ================= */
function recordAnswer(tab, v, ok){
  stats.answered++;
  if (ok) stats.correct++;
  LS.set('v4t:stats', stats);
  if (!ok) addWrong(v);
  else if (CUR_DS === 'wrong') removeWrong(v);
  renderFoot();
  updateNav();
}
function clickOpt(tab, i, el){
  const s = getSession(CUR_DS, tab, false);
  if (!s || s.answers[i]) return;
  const v = s.items[i];
  const correctKey = tab === 'mc-en' ? v.meaning : v.word;
  const chosenKey = el.dataset.key;
  const ok = chosenKey === correctKey;
  s.answers[i] = { chosen: chosenKey, ok: ok };
  const q = $(tab + '-q' + i);
  if (q){
    $$('.opt', q).forEach(function(o){
      o.disabled = true;
      if (o.dataset.key === correctKey) o.classList.add('correct');
    });
    if (!ok) el.classList.add('wrong');
    const fb = $('fb-' + tab + '-' + i);
    if (fb) fb.innerHTML = fbHtml(tab, v, s.answers[i]);
  }
  saveSaved(CUR_DS, tab, s);
  recordAnswer(tab, v, ok);
  updateStat(tab);
  renderDone(tab);
}
function doCheck(tab, i, reveal){
  const s = getSession(CUR_DS, tab, false);
  if (!s || s.answers[i]) return;
  const v = s.items[i];
  const dir = tab === 'write-en' ? 'en' : 'vn';
  const input = $((dir === 'en' ? 'we-in' : 'wv-in') + i);
  const raw = input ? input.value.trim() : '';
  if (!reveal && !raw){
    if (input){
      input.focus();
      input.classList.add('shake');
      setTimeout(function(){ input.classList.remove('shake'); }, 420);
    }
    return;
  }
  const ok = reveal ? false : grade(dir, v, raw);
  s.answers[i] = { ok: ok, ans: raw };
  const dkey = CUR_DS + '|' + tab + '|' + i;
  delete DRAFT[dkey];
  if (input){
    input.readOnly = true;
    input.classList.add(ok ? 'correct' : 'wrong');
  }
  const q = $((dir === 'en' ? 'we' : 'wv') + '-q' + i);
  if (q){
    q.classList.add('answered');
    $$('.btn', q).forEach(function(b){ if (b.dataset.check || b.dataset.reveal) b.remove(); });
  }
  const fb = $('fb-' + tab + '-' + i);
  if (fb) fb.innerHTML = fbHtml(tab, v, s.answers[i]);
  saveSaved(CUR_DS, tab, s);
  recordAnswer(tab, v, ok);
  updateStat(tab);
  renderDone(tab);
  if (ok) focusNextWrite(tab, i);
}
function focusNextWrite(tab, i){
  const s = S[CUR_DS] && S[CUR_DS][tab];
  if (!s) return;
  for (let j = i + 1; j < s.items.length; j++){
    if (!s.answers[j]){
      const inp = $((tab === 'write-en' ? 'we-in' : 'wv-in') + j);
      if (inp){
        setTimeout(function(){
          inp.focus({ preventScroll: true });
          try { inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { inp.scrollIntoView(); }
        }, 120);
      }
      return;
    }
  }
}
function navFocus(tab, i, dir){
  const s = S[CUR_DS] && S[CUR_DS][tab];
  if (!s) return;
  let j = i + dir;
  if (j < 0 || j >= s.items.length) return;
  const inp = $((tab === 'write-en' ? 'we-in' : 'wv-in') + j);
  if (inp && !inp.readOnly){
    inp.focus({ preventScroll: true });
    try { inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { inp.scrollIntoView(); }
  } else {
    const q = $((tab === 'write-en' ? 'we' : 'wv') + '-q' + j);
    if (q) try { q.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
  }
}

/* ================= events ================= */
document.addEventListener('click', function(e){
  const hit = function(sel){ return e.target.closest(sel); };
  let el;
  if ((el = hit('[data-nav]'))){ showScreen(el.dataset.nav); return; }
  if ((el = hit('[data-lang]'))){ setLang(el.dataset.lang); return; }
  if ((el = hit('[data-goto-ex]'))){ showExercise(el.dataset.gotoEx); return; }
  if ((el = hit('[data-ex]'))){ selectEx(el.dataset.ex); return; }
  if ((el = hit('[data-ds]'))){ setDs(el.dataset.ds); return; }
  if ((el = hit('[data-back]'))){ backFromExercise(); return; }
  if ((el = hit('[data-wrong-practice]'))){ practiceWrong(); return; }
  if ((el = hit('[data-dict-lang]'))){ setDictLang(el.dataset.dictLang); return; }
  if ((el = hit('[data-az]'))){ setDictLetter(el.dataset.az); return; }
  if ((el = hit('[data-dict-clear]'))){
    $('dictQ').value = '';
    renderDict();
    $('dictQ').focus();
    return;
  }
  if ((el = hit('[data-wrong-clear]'))){
    $('wrongQ').value = '';
    renderWrong();
    $('wrongQ').focus();
    return;
  }
  if ((el = hit('[data-sheet-spk]'))){
    const lang = settings.lang;
    const entry = DICT_MAP[lang] && DICT_MAP[lang][el.dataset.sheetSpk];
    if (entry) speak(entry.disp, lang);
    return;
  }
  if ((el = hit('[data-dspk]'))){
    const lang = settings.lang;
    const entry = DICT_MAP[lang] && DICT_MAP[lang][el.dataset.dspk];
    if (entry) speak(entry.disp, lang);
    return;
  }
  if ((el = hit('[data-dkey]'))){ openDetail(el.dataset.dkey); return; }
  if ((el = hit('[data-sheet-close]'))){ closeSheet(); return; }
  if ((el = hit('[data-wspk]'))){
    const w = WRONG_VIEW[+el.dataset.wspk];
    if (w) speak(w.word, settings.lang);
    return;
  }
  if ((el = hit('[data-mc]'))){
    const parts = el.dataset.mc.split(':');
    clickOpt(parts[0], +parts[1], el);
    return;
  }
  if ((el = hit('[data-check]'))){
    const parts = el.dataset.check.split(':');
    doCheck(parts[0], +parts[1], false);
    return;
  }
  if ((el = hit('[data-reveal]'))){
    const parts = el.dataset.reveal.split(':');
    doCheck(parts[0], +parts[1], true);
    return;
  }
  if ((el = hit('[data-spk]'))){
    const parts = el.dataset.spk.split(':');
    speakItem(parts[0], +parts[1]);
    return;
  }
  if ((el = hit('[data-again]'))){ rebuild(el.dataset.again); return; }
  if ((el = hit('[data-reset]'))){ resetAll(); return; }
});
document.addEventListener('input', function(e){
  const el = e.target;
  if (!el || !el.dataset) return;
  if (el.dataset.winput){
    const parts = el.dataset.winput.split(':');
    DRAFT[CUR_DS + '|' + parts[0] + '|' + parts[1]] = el.value;
  }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (!$('sheetWrap').hidden){ closeSheet(); return; }
  }
  const el = e.target;
  if (!el || !el.dataset || !el.dataset.winput) {
    if (e.key === 'Enter' && el && el.dataset && el.dataset.dkey){ openDetail(el.dataset.dkey); }
    return;
  }
  const parts = el.dataset.winput.split(':');
  if (e.key === 'Enter'){
    e.preventDefault();
    doCheck(parts[0], +parts[1], false);
  } else if (e.key === 'ArrowDown'){
    e.preventDefault();
    navFocus(parts[0], +parts[1], 1);
  } else if (e.key === 'ArrowUp'){
    e.preventDefault();
    navFocus(parts[0], +parts[1], -1);
  }
});

/* ================= init ================= */
(function init(){
  $('sizeSel').value = String(settings.size);
  $('sizeSel').addEventListener('change', function(e){ setSize(+e.target.value); });
  const dq = $('dictQ');
  let dt = null;
  dq.addEventListener('input', function(){
    if (dt) clearTimeout(dt);
    dt = setTimeout(function(){ renderDict(); }, 120);
  });
  dq.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ dq.value = ''; renderDict(); } });
  const wq = $('wrongQ');
  let wt = null;
  wq.addEventListener('input', function(){
    if (wt) clearTimeout(wt);
    wt = setTimeout(function(){ renderWrong(); }, 120);
  });
  wq.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ wq.value = ''; renderWrong(); } });
  updateChrome();
  showScreen(settings.screen);
  requestAnimationFrame(function(){
    const nav = $('bnav');
    if (nav) nav.classList.add('is-ready');
  });
})();
</script>
